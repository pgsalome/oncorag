[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoraggraph"
version = "1.0.0"
description = "A medical knowledge graph construction and retrieval system for oncology data"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Patrick Salome"}
]
maintainers = [
    {name = "Patrick Salome"}
]
keywords = [
    "medical",
    "oncology", 
    "knowledge-graph",
    "rag",
    "retrieval-augmented-generation",
    "nlp",
    "clinical-data",
    "healthcare-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.23.1",
    "chromadb>=0.4.24",
    "medspacy>=1.3.1",
    "networkx>=3.4",
    "nltk>=3.8",
    "numpy>=1.24",
    "ollama>=0.6.0",
    "openai>=1.30.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "scispacy>=0.5.4",
    "sentence-transformers>=2.2.2",
    "spacy>=3.7",
    "torch>=2.1",
    "urllib3>=2.1",
]

[project.optional-dependencies]
iris = ["intersystems-irispython"]
chat = ["streamlit>=1.50", "altair>=5"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.17",
]

[project.scripts]
oncoraggraph = "oncoraggraph.pipeline:main"
oncorag = "oncoraggraph.pipeline:main"
oncorag-chat = "oncoraggraph.chat_runtime:main"

[project.urls]
Homepage = "https://github.com/pgsalome/oncorag"
Repository = "https://github.com/pgsalome/oncorag"
Issues = "https://github.com/pgsalome/oncorag/issues"
Documentation = "https://github.com/pgsalome/oncorag#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["oncoraggraph*"]

[tool.setuptools.package-data]
oncoraggraph = [
    "system_config.yaml",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
